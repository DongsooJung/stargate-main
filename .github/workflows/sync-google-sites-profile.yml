name: Sync Google Sites instructor profile

on:
  schedule:
    - cron: '15 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-google-sites-profile
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and validate public profile
        run: node scripts/sync-google-sites-profile.mjs

      - name: Commit updated profile data
        run: |
          if git diff --quiet -- data/google-sites-profile.json; then
            echo "No profile changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/google-sites-profile.json
          git commit -m "Google Sites 강사 프로필 자동 동기화"
          git push
